<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" lang="en" />
    <title>My Tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="navigation">
      <nav>
        <ul>
          <li><a href="home_page.html">Home</a></li>
          <li>Calendar</li>
          <li>Theme</li>
          <li><a href="settings_page.html">Settings</a></li>
          <li>Login</li>
        </ul>
        <!--toggle switch---->
        <input type="checkbox" id="switch" />
        <label for="switch" class="toggle"></label>
      </nav>
    </section>

    <section class="input">
      <input class="due_date" type="date" />
      <input class="add_tasks_field" type="text" placeholder="add a new task" />
      <select class="category">
        <option value="">Select category</option>
        <option class="money">Money</option>
        <option class="future">Future</option>
        <option class="mental">Mental</option>
        <option class="spiritual">Spiritual</option>
        <option class="body">Body</option>
        <option class="beauty">Beauty</option>
        <option class="interests">Interests</option>
        <option class="community">Community</option>
        <option class="friendships">Friendships</option>
        <option class="school">School</option>
        <option class="nutrition">Nutrition</option>
        <option class="house_work">House Work</option>
      </select>
      <button class="add_task">+</button>
    </section>

    <section>
      <h2 class="titles" id="to_do_list">To-do List</h2>
      <ul style="list-style: none" id="tasks_list"></ul>
    </section>

    <div>
      <p id="tryin">Try me!</p>
      <button id="click">click me</button>
    </div>

    <section>
      <h2 class="titles">Progress Summary</h2>
      <div id="progress">
        <button id="box_4" class="pending">
          Pending
          <span class="count" id="pending_count"></span>
        </button>
        <button id="box_5" class="completed">
          Completed
          <span class="count" id="completed_count"></span>
        </button>
        <button id="box_6" class="all">
          All
          <p class="count" id="all_count"></p>
        </button>
      </div>
    </section>
    <script src="script.js"></script>
    <script src="tasks.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      //slide in and out effect of tasks using jQuery
      $(document).ready(function () {
        $("#click").click(function () {
          $("#tryin").animation(300);
        });
      });
    </script>
  </body>
</html>
